name: Package release sanity check

on:
  pull_request:
    paths:
      - pkg.env

permissions:
  contents: read

jobs:
  check:
    name: Warn if package_release wasn't reset on a varnish_version bump
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compare varnish_version and package_release against base branch
        run: |
          set -e

          git show "origin/${{ github.base_ref }}:pkg.env" > /tmp/base_pkg.env

          OLD_VERSION=$(bash -c '. /tmp/base_pkg.env; echo "${VARS[varnish_version]}"')
          OLD_RELEASE=$(bash -c '. /tmp/base_pkg.env; echo "$package_release"')
          NEW_VERSION=$(bash -c '. pkg.env; echo "${VARS[varnish_version]}"')
          NEW_RELEASE=$(bash -c '. pkg.env; echo "$package_release"')

          echo "varnish_version: $OLD_VERSION -> $NEW_VERSION"
          echo "package_release: $OLD_RELEASE -> $NEW_RELEASE"

          if [ "$OLD_VERSION" != "$NEW_VERSION" ] && [ "$NEW_RELEASE" != "1" ]; then
            echo "::error file=pkg.env::varnish_version changed ($OLD_VERSION -> $NEW_VERSION) but package_release is $NEW_RELEASE instead of being reset to 1. A new upstream version should normally start a fresh package_release cycle, double check this is intentional."
            exit 1
          fi
